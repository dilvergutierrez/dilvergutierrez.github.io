<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba en Vivo Cloudflare (WebRTC + Marca de Agua)</title>
  <style>
    body { margin: 0; background: #0b0f19; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    #player-box { position: relative; width: 90%; max-width: 850px; aspect-ratio: 16/9; background: #000; border: 1px solid #334155; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #watermark { position: absolute; top: 15%; left: 15%; color: rgba(255, 255, 255, 0.45); font-size: 16px; font-weight: bold; pointer-events: none; text-shadow: 1px 1px 3px #000; transition: all 0.8s ease; z-index: 10; }
    #status { margin-top: 10px; font-size: 13px; color: #94a3b8; }
  </style>
</head>
<body>

  <div id="player-box">
    <video id="live-video" autoplay playsinline muted controls></video>
    <div id="watermark">PIN: 948271 - USUARIO UNICO</div>
  </div>
  <div id="status">Conectando con Cloudflare Stream...</div>

  <script>
    // PEGA AQUÍ TU MISMA URL WHEP TERMINADA EN /webRTC/play:
    const WHEP_URL = "https://customer-9zu3fnvsmv8gejie.cloudflarestream.com/493b17f85b80cbca3a97a303f5d015d5/webRTC/play";

    async function iniciarWebRTC() {
      const video = document.getElementById('live-video');
      const status = document.getElementById('status');

      // Crear un contenedor MediaStream explícito para que el video no quede en negro
      const mediaStream = new MediaStream();
      video.srcObject = mediaStream;

      const pc = new RTCPeerConnection({
        iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }],
        bundlePolicy: 'max-bundle'
      });

      pc.addTransceiver('video', { direction: 'recvonly' });
      pc.addTransceiver('audio', { direction: 'recvonly' });

      // Agregar cada pista recibida (video y audio) directamente al MediaStream
      pc.ontrack = (event) => {
        console.log("Pista recibida de Cloudflare:", event.track.kind);
        mediaStream.addTrack(event.track);
        video.play().catch(e => console.error("Error al reproducir:", e));
      };

      pc.onconnectionstatechange = () => {
        status.innerText = "Estado WebRTC: " + pc.connectionState;
      };

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      // Esperar a que el navegador reúna los candidatos ICE antes de enviar a Cloudflare
      await new Promise((resolve) => {
        if (pc.iceGatheringState === 'complete') {
          resolve();
        } else {
          const checkState = () => {
            if (pc.iceGatheringState === 'complete') {
              pc.removeEventListener('icegatheringstatechange', checkState);
              resolve();
            }
          };
          pc.addEventListener('icegatheringstatechange', checkState);
          setTimeout(resolve, 2000); // Tope de 2s por seguridad
        }
      });

      const response = await fetch(WHEP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/sdp' },
        body: pc.localDescription.sdp
      });

      if (!response.ok) {
        status.innerText = "Error HTTP: " + response.status;
        return;
      }

      const answerSdp = await response.text();
      await pc.setRemoteDescription(new RTCSessionDescription({ type: 'answer', sdp: answerSdp }));
    }

    setInterval(() => {
      const wm = document.getElementById('watermark');
      wm.style.top = Math.floor(Math.random() * 75 + 5) + "%";
      wm.style.left = Math.floor(Math.random() * 65 + 5) + "%";
    }, 7000);

    iniciarWebRTC();
  </script>
</body>
</html>
